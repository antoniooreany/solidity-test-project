name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Lint, compile, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npm test

  dry-run-deploy:
    name: Dry-Run deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Test deployment script (Dry Run)
        env:
          DRY_RUN: "true"
          DEPLOY_NETWORK: "local"
          ALLOW_SEPOLIA_DEPLOY: "false"
        run: node scripts/deploy.js

  commitlint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          # Conventional Commits pattern: type(scope): description
          PATTERN='^(feat|fix|test|docs|chore|refactor|ci|perf|style|build|revert)(\(.+\))?: .+'
          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✅ PR title follows Conventional Commits format"
          else
            echo "❌ PR title does NOT follow Conventional Commits format"
            echo ""
            echo "Expected format: <type>(<scope>): <description>"
            echo "Types: feat, fix, test, docs, chore, refactor, ci, perf, style, build, revert"
            echo "Example: feat(counter): add increment function"
            exit 1
          fi

  spec-traceability:
    name: Verify spec traceability
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check that every contract has a corresponding spec
        run: |
          echo "=== Spec Traceability Check ==="
          EXIT_CODE=0

          for contract in contracts/*.sol; do
            name=$(basename "$contract" .sol)
            # Search for spec.md files that reference this contract
            found=false
            for spec_dir in specs/*/; do
              if [ -f "${spec_dir}spec.md" ]; then
                if grep -qi "$name" "${spec_dir}spec.md" 2>/dev/null; then
                  found=true
                  echo "✅ $name.sol → ${spec_dir}spec.md"
                  break
                fi
              fi
            done
            if [ "$found" = false ]; then
              echo "❌ $name.sol — NO SPEC FOUND in specs/"
              EXIT_CODE=1
            fi
          done

          echo ""
          echo "=== Test Coverage Check ==="
          for contract in contracts/*.sol; do
            name=$(basename "$contract" .sol)
            test_file="test/${name}_test.sol"
            if [ -f "$test_file" ]; then
              echo "✅ $name.sol → $test_file"
            else
              echo "❌ $name.sol — NO TEST FILE at $test_file"
              EXIT_CODE=1
            fi
          done

          exit $EXIT_CODE
